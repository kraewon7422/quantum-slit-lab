<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quantum Lab · 양자 실험실</title>
<meta name="description" content="Five quantum experiments in the browser: double slit and electron diffraction solved from the Schrödinger equation, X-ray powder diffraction, DNA fibre diffraction (Photo 51) and the Compton effect, each compared with theory in numbers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080b12;--panel:#0f1420;--panel2:#141b2a;--line:#232c3f;--fg:#e7ecf5;--muted:#8b97ad;--dim:#5d687d;
  --acc:#7fd7ff;--sim:#f2f5fa;--fr:#ffb454;--hu:#6fe0c0;--dot:#bfe6ff;--warn:#ff8a7a;--ok:#8ee59b;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:'Noto Sans KR',system-ui,-apple-system,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-size:14px;line-height:1.5;word-break:keep-all;overflow-wrap:break-word}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* ---------- header: brand + experiment tabs */
header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 22px;padding:12px 18px 0;border-bottom:1px solid var(--line);background:#0a0e17}
.brand{display:flex;flex-direction:column;min-width:0;padding-bottom:12px}
.brand b{font-size:17px;letter-spacing:.14em;font-weight:700;white-space:nowrap}
.brand span{font-size:12px;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:2px;margin-right:auto}
.tabs button{border:0;background:none;padding:8px 12px 11px;border-bottom:2px solid transparent;color:var(--muted);white-space:nowrap;display:flex;align-items:baseline;gap:6px}
.tabs button small{font-family:var(--mono);font-size:11px;color:var(--dim)}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--fg);font-weight:700;border-bottom-color:var(--acc)}
.tabs button[aria-selected="true"] small{color:var(--acc)}
.hbar{display:flex;gap:8px;align-items:center;padding-bottom:10px}
.lead{max-width:1760px;margin:0 auto;padding:10px 18px 0;color:var(--muted);font-size:13px}
.lead b{color:var(--fg);font-weight:500}

.btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:7px 13px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:#3a4763}
.btn.primary{background:#14324a;border-color:#2c6d96;color:#d8f2ff;font-weight:700}
.btn.primary:hover{background:#18405e}
.btn[disabled]{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:nowrap}
.seg button{border:0;background:var(--panel);padding:7px 11px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:#1b2a40;color:var(--acc);font-weight:700}
.lbl{font-size:12px;color:var(--muted);white-space:nowrap}
input[type=range]{accent-color:var(--acc);vertical-align:middle}
select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}

/* ---------- layout: stage left, every setting on the right (as in Turing Lab) */
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;padding:12px 18px 18px;max-width:1760px;margin:0 auto;align-items:start}
.col{min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.panel h2{font-size:13px;color:var(--fg);font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.panel h2 .n{font-family:var(--mono);font-size:11px;color:var(--acc);border:1px solid #2c6d96;border-radius:5px;padding:0 5px}
.panel+.panel{margin-top:12px}
.side .xp{display:none}.side .xp.on{display:block}

.setups{display:grid;gap:6px}
.setup{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 10px}
.setup svg{flex:none}
.setup b{display:block;font-size:14px;font-weight:500}
.setup small{display:block;color:var(--muted);font-size:11.5px}
.setup[aria-pressed="true"]{border-color:#2c6d96;background:#122236}
.setup[aria-pressed="true"] b{color:var(--acc)}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:6px 10px;white-space:nowrap}
.presets button[aria-pressed="true"]{border-color:#2c6d96;background:#122236;color:var(--acc);font-weight:700}

.ctl{margin:12px 0 0}
.ctl .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ctl label{font-size:13px}
.ctl output{font-family:var(--mono);font-size:12.5px;color:var(--acc);white-space:nowrap}
.ctl input[type=range]{width:100%;margin:4px 0;display:block}
.ctl .help{font-size:11.5px;color:var(--dim)}
.row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 10px;align-items:center;margin-top:10px;font-size:13px}
.switch{display:flex;align-items:center;gap:10px;margin-top:4px}
.switch input{width:40px;height:22px;appearance:none;-webkit-appearance:none;background:#273147;border-radius:11px;position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#cfd7e6;top:3px;left:3px;transition:left .15s}
.switch input:checked{background:#a8485a}
.switch input:checked::after{left:21px}
.switch input:disabled{opacity:.4;cursor:default}
.formula{font-family:var(--mono);font-size:12.5px;background:#0b101a;border:1px solid var(--line);border-radius:8px;padding:9px 10px;line-height:1.7;overflow-x:auto}
.formula i{color:var(--fr);font-style:normal}
.formula .fn{font-family:'Noto Sans KR',system-ui,sans-serif;color:var(--muted);font-size:12px;display:block;margin-top:2px}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}

/* stage 1: Schrödinger grid (slit, electron) */
.stage{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#06090f;max-width:calc((100vh - 220px) * 4 / 3 + 210px);margin:0 auto}
.wave{position:relative;flex:1 1 auto;min-width:0;aspect-ratio:4/3}
.wave canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.det{flex:0 0 210px;position:relative;border-left:1px solid var(--line);background:#070a10}
.det canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
/* stage 2: view + plot (X-ray, DNA, Compton) */
.stage2{display:none;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#06090f;max-width:calc((100vh - 220px) * 2.15);margin:0 auto}
.stage2.on{display:grid}
.stage2 .view{position:relative;aspect-ratio:1/1;min-width:0}
.stage2 .plot{position:relative;min-width:0;border-left:1px solid var(--line);background:#070a10}
.stage2 canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.msg{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(10,15,25,.86);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .25s;width:max-content;max-width:calc(100% - 20px);text-align:center;line-height:1.4}
.msg.on{opacity:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;padding:8px 0 0;font-size:12px;color:var(--muted)}
.legend button,.legend span.k{border:0;background:none;padding:2px 4px;display:inline-flex;align-items:center;gap:6px;color:var(--muted);white-space:nowrap}
.legend button[aria-pressed="false"]{opacity:.38}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px}
.guide{max-width:820px;margin:10px auto 0;font-size:12.5px;color:var(--muted);display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:6px 18px}
.guide div{display:flex;gap:8px;align-items:flex-start}
.guide i{flex:none;width:12px;height:12px;border-radius:3px;margin-top:4px}

/* metrics */
.metric{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line)}
.metric:first-of-type{border-top:0;padding-top:0}
.metric .k{font-size:13px}
.metric .k small{display:block;color:var(--dim);font-size:11.5px}
.metric .v{font-family:var(--mono);font-size:13.5px;text-align:right;white-space:nowrap}
.metric .v small{display:block;font-size:11.5px;color:var(--muted)}
.good{color:var(--ok)}.bad{color:var(--warn)}
.big{font-size:20px;font-weight:600}
table.tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
table.tbl th{font-weight:500;color:var(--muted);text-align:right;padding:3px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
table.tbl td{font-family:var(--mono);text-align:right;padding:3px 4px;border-bottom:1px solid #1a2132;white-space:nowrap}
table.tbl th:first-child,table.tbl td:first-child{text-align:left}
table.tbl tr.abs td{color:var(--dim)}
.scan{width:100%;height:150px;display:block;margin-top:8px;background:#0b101a;border:1px solid var(--line);border-radius:8px}

/* ---------- transport bar (bottom, as in Turing Lab) */
.transport{position:sticky;bottom:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 18px;border-top:1px solid var(--line);background:rgba(10,14,23,.96);backdrop-filter:blur(6px)}
.transport .sep{width:1px;height:24px;background:var(--line)}
.transport .status{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:12px;color:var(--muted);margin-left:auto;justify-content:flex-end}
.transport .status span{white-space:nowrap}
.transport .status b{color:var(--fg);font-weight:600;font-family:var(--mono)}
.grp{display:flex;flex-wrap:wrap;align-items:center;gap:8px}

/* learn overlay + tests */
#learn,#testOut{position:fixed;inset:0;background:rgba(4,6,10,.78);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
#learn.on,#testOut.on{display:flex}
.card{background:var(--panel);border:1px solid #2b3650;border-radius:14px;max-width:640px;width:100%;padding:22px 24px;max-height:90vh;overflow:auto}
.card h3{margin:0 0 4px;font-size:19px}
.card .step{font-size:12px;color:var(--acc);letter-spacing:.1em}
.card p{color:#c9d2e2;margin:10px 0}
.card .eq{font-family:var(--mono);background:#0b101a;border-radius:8px;padding:8px 10px;color:var(--fr);overflow-x:auto}
.card .nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:8px}
.dots{display:flex;gap:6px}.dots i{width:8px;height:8px;border-radius:50%;background:#2b3650}.dots i.on{background:var(--acc)}
#testOut .card{max-width:860px;font-size:13px}
#testOut table{border-collapse:collapse;width:100%}
#testOut td{border-top:1px solid var(--line);padding:5px 6px;vertical-align:top}
#testOut td:nth-child(3){font-family:var(--mono);font-size:12px;color:var(--muted)}
footer{color:var(--dim);font-size:12px;text-align:center;padding:4px 18px 16px;display:flex;flex-wrap:wrap;justify-content:center;gap:2px 6px}
footer a{color:var(--muted)}

/* ---------- responsive */
@media (max-width:1180px){
  main{grid-template-columns:minmax(0,1fr) 330px}
  .tabs button{padding:8px 9px 11px}
}
@media (max-width:900px){
  header{padding:8px 12px 0;gap:4px 12px}
  .brand{padding-bottom:4px}.brand b{font-size:15px}
  .tabs{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:0}
  .tabs::-webkit-scrollbar{display:none}
  .hbar{margin-left:auto;padding-bottom:4px}
  .lead{padding:8px 12px 0;font-size:12.5px}
  main{grid-template-columns:minmax(0,1fr);padding:10px 10px 14px}
  .stage,.stage2{max-width:none}
  .det{flex-basis:30%}
  .stage2{grid-template-columns:minmax(0,1fr)}
  .stage2 .plot{border-left:0;border-top:1px solid var(--line);aspect-ratio:1/1.05}
  .transport{padding:8px 10px;gap:6px 8px}
  .transport .status,.transport .sep{display:none}
  .btn{padding:6px 10px;font-size:13px}
  .seg button{padding:6px 9px;font-size:13px}
  .spdl{display:none}
  #speed{width:70px!important}
  .msg{font-size:12px;top:8px}
}
</style>
</head>
<body>
<header>
  <div class="brand"><b>QUANTUM LAB</b><span data-i18n="tagline">빛과 전자가 파동이면서 입자임을 보여 주는 다섯 실험</span></div>
  <nav class="tabs" id="tabs" role="tablist">
    <button role="tab" data-exp="slit" aria-selected="true"><small>1</small><span data-i18n="tabSlit">이중 슬릿</span></button>
    <button role="tab" data-exp="electron" aria-selected="false"><small>2</small><span data-i18n="tabElectron">전자선 회절</span></button>
    <button role="tab" data-exp="xray" aria-selected="false"><small>3</small><span data-i18n="tabXray">X선 회절</span></button>
    <button role="tab" data-exp="dna" aria-selected="false"><small>4</small><span data-i18n="tabDna">DNA 회절</span></button>
    <button role="tab" data-exp="compton" aria-selected="false"><small>5</small><span data-i18n="tabCompton">콤프턴 효과</span></button>
  </nav>
  <div class="hbar">
    <button class="btn" id="learnBtn" data-i18n="learn">? 원리</button>
    <div class="seg" id="langSeg" role="group" aria-label="language">
      <button data-lang="ko" aria-pressed="true">KO</button><button data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
</header>
<p class="lead" id="lead"></p>

<main>
  <div class="col stagecol">
    <!-- stage 1: Schrödinger grid -->
    <div class="stage" id="stage">
      <div class="wave" id="wave">
        <canvas id="glCanvas" aria-label="wave function"></canvas>
        <canvas id="cpuCanvas" style="display:none"></canvas>
        <canvas id="ovCanvas"></canvas>
        <div class="msg" id="msg"></div>
      </div>
      <div class="det" id="det"><canvas id="detCanvas" aria-label="detector"></canvas></div>
    </div>
    <!-- stage 2: view + plot -->
    <div class="stage2" id="stage2">
      <div class="view" id="view2"><canvas id="c2a"></canvas><div class="msg" id="msg2"></div></div>
      <div class="plot" id="plot2"><canvas id="c2b"></canvas></div>
    </div>
    <div class="legend" id="legend">
      <button data-layer="sim" aria-pressed="true"><i style="background:var(--sim)"></i><span id="lg_sim"></span></button>
      <button data-layer="hist" aria-pressed="true"><i style="background:var(--dot)"></i><span id="lg_hist"></span></button>
      <button data-layer="fr" aria-pressed="true"><i style="background:var(--fr)"></i><span id="lg_fr"></span></button>
      <button data-layer="hu" aria-pressed="true"><i style="background:var(--hu)"></i><span id="lg_hu"></span></button>
    </div>
    <div class="guide" id="guide"></div>
  </div>

  <aside class="col side" id="side">
    <!-- ===== 1 slit ===== -->
    <div class="xp" data-exp="slit">
      <section class="panel">
        <h2><span class="n">1</span><span data-i18n="hSetup">실험 장치</span></h2>
        <div class="setups" id="setups">
          <button class="setup" data-setup="single" aria-pressed="false">
            <svg width="30" height="30" viewBox="0 0 30 30"><path d="M14 2v10M14 18v10" stroke="#cfd7e6" stroke-width="3"/></svg>
            <span><b data-i18n="sSingle">단일 슬릿</b><small data-i18n="sSingleD">회절: 구멍 하나로도 퍼진다</small></span></button>
          <button class="setup" data-setup="double" aria-pressed="true">
            <svg width="30" height="30" viewBox="0 0 30 30"><path d="M14 2v6M14 12v6M14 22v6" stroke="#cfd7e6" stroke-width="3"/></svg>
            <span><b data-i18n="sDouble">이중 슬릿</b><small data-i18n="sDoubleD">간섭: 두 길이 겹친다</small></span></button>
          <button class="setup" data-setup="multi" aria-pressed="false">
            <svg width="30" height="30" viewBox="0 0 30 30"><path d="M14 2v3M14 8v3M14 14v3M14 20v3M14 26v2" stroke="#cfd7e6" stroke-width="3"/></svg>
            <span><b data-i18n="sMulti">다중 슬릿 (격자)</b><small data-i18n="sMultiD">N개의 길: 밝은 줄이 날카로워진다</small></span></button>
        </div>
        <div class="ctl"><div class="top"><label for="lam" data-i18n="cLam">파장 λ</label><output id="lamOut"></output></div>
          <input type="range" id="lam" min="6" max="16" step="0.5"><div class="help" data-i18n="cLamH"></div></div>
        <div class="ctl" id="ctlD"><div class="top"><label for="d" data-i18n="cD">슬릿 간격 d</label><output id="dOut"></output></div>
          <input type="range" id="d" min="16" max="80" step="2"></div>
        <div class="ctl"><div class="top"><label for="a" data-i18n="cA">슬릿 폭 a</label><output id="aOut"></output></div>
          <input type="range" id="a" min="4" max="32" step="1"></div>
        <div class="ctl" id="ctlN"><div class="top"><label for="n" data-i18n="cN">슬릿 수 N</label><output id="nOut"></output></div>
          <input type="range" id="n" min="3" max="5" step="1"></div>
        <div class="ctl"><div class="top"><label for="sig" data-i18n="cSig">파속 폭 σ</label><output id="sigOut"></output></div>
          <input type="range" id="sig" min="14" max="30" step="1"><div class="help" data-i18n="cSigH"></div></div>
      </section>
      <section class="panel">
        <h2><span class="n">2</span><span data-i18n="hObs">관측</span></h2>
        <div class="switch"><input type="checkbox" id="obs" role="switch"><label for="obs" data-i18n="obsLabel">어느 슬릿을 지났는지 측정하기</label></div>
        <p class="note" id="obsNote"></p>
      </section>
      <section class="panel">
        <h2><span class="n">3</span><span data-i18n="hParticles">입자 모드</span></h2>
        <div class="metric"><div class="k"><span data-i18n="mDots">검출된 입자</span><small data-i18n="mDotsS"></small></div><div class="v"><span class="big" id="dotCount">0</span></div></div>
        <div class="metric"><div class="k"><span data-i18n="mTV"></span><small data-i18n="mTVS"></small></div><div class="v" id="tvVal">—</div></div>
        <p class="note" data-i18n="partNote"></p>
      </section>
      <section class="panel">
        <h2><span class="n">4</span><span data-i18n="hTheory">이론식</span></h2>
        <div class="formula" id="formula"></div>
        <p class="note" id="fresnelNote"></p>
      </section>
      <section class="panel">
        <h2><span class="n">5</span><span data-i18n="hCompare">시뮬레이션 vs 이론</span></h2>
        <div id="metrics"></div>
      </section>
    </div>
    <!-- ===== 2 electron ===== -->
    <div class="xp" data-exp="electron">
      <section class="panel">
        <h2><span class="n">1</span><span data-i18n="hSetup">실험 장치</span></h2>
        <div class="presets" id="elPresets">
          <button data-e="54" data-i18n="elP54">54 eV (데이비슨–거머)</button><button data-e="30" data-i18n="elP30">30 eV</button><button data-e="100" data-i18n="elP100">100 eV</button>
        </div>
        <div class="ctl"><div class="top"><label for="elE" data-i18n="elE">가속 전압 V</label><output id="elEOut"></output></div>
          <input type="range" id="elE" min="20" max="120" step="1"><div class="help" data-i18n="elEH"></div></div>
        <div class="row"><span data-i18n="elCrystal">결정</span><span class="note" style="margin:0" data-i18n="elCrystalV"></span></div>
      </section>
      <section class="panel">
        <h2><span class="n">2</span><span data-i18n="hScan">에너지 스캔</span></h2>
        <button class="btn" id="elScanBtn" data-i18n="elScan">에너지 스캔 시작 (30 → 90 eV)</button>
        <canvas class="scan" id="elScan"></canvas>
        <p class="note" id="elScanNote" data-i18n="elScanNote"></p>
      </section>
      <section class="panel">
        <h2><span class="n">3</span><span data-i18n="hTheory">이론식</span></h2>
        <div class="formula" id="elFormula"></div>
      </section>
      <section class="panel">
        <h2><span class="n">4</span><span data-i18n="hCompare">시뮬레이션 vs 이론</span></h2>
        <div id="elMetrics"></div>
      </section>
    </div>
    <!-- ===== 3 X-ray ===== -->
    <div class="xp" data-exp="xray">
      <section class="panel">
        <h2><span class="n">1</span><span data-i18n="hSample">시료</span></h2>
        <div class="presets" id="xrCrystals">

<!-- ==================================================================== -->
<!-- Physics core 1: Schrödinger grid, slits (no DOM; runs in node)        -->
<!-- ==================================================================== -->
<script id="core">
var QSL = (function () {
  'use strict';
  var GRID_W = 512, GRID_H = 384, BAND = 32, ALPHA = 0.05, V_CAP = 3, DT_DEFAULT = 0.2;
  var LAP_EMAX = 16 / 3;          // max eigenvalue of −½∇² with the 4th-order 13-point stencil (2-D)
  var LAMBDA_MIN = 6;

  // Visscher leapfrog is stable for dt·E_max ≤ 2 (E_max = 16/3 + V_max); keep a 10 % margin
  function stableDt(vmax, want) { return Math.min(want || DT_DEFAULT, 0.9 * 2 / (LAP_EMAX + Math.max(0, vmax))); }

  // absorbing band: ψ is multiplied by 1 − α s² every step (s = depth into the band, 0..1); outer 2 cells are 0
  function absorberMask(W, H, band, alpha, on) {
    var M = new Float32Array(W * H);
    for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
      var i = y * W + x;
      if (x < 2 || y < 2 || x > W - 3 || y > H - 3) { M[i] = 0; continue; }
      if (!on) { M[i] = 1; continue; }
      var d = Math.min(x, y, W - 1 - x, H - 1 - y), s = d < band ? (band - d) / band : 0;
      M[i] = 1 - alpha * s * s;
    }
    return M;
  }

  /* ---------------- CPU reference integrator (Float64) ---------------- */
  // ψ = R + iI;  ∂R/∂t = H I,  ∂I/∂t = −H R,  H = −½∇² + V.  R lives at integer steps, I at half steps.
  function CpuSim(W, H) {
    this.W = W; this.H = H; var n = W * H;
    this.R = new Float64Array(n); this.I = new Float64Array(n); this.Ip = new Float64Array(n);
    this.V = new Float64Array(n); this.M = new Float64Array(n); this.tmp = new Float64Array(n);
    this.t = 0; this.dt = DT_DEFAULT; this.M.set(absorberMask(W, H, BAND, 0, false));
  }
  CpuSim.prototype.applyH = function (f, out) {
    var W = this.W, H = this.H, V = this.V, a0 = -30 / 12, a1 = 16 / 12, a2 = -1 / 12;
    out.fill(0);
    for (var y = 2; y < H - 2; y++) for (var x = 2, i = y * W + 2; x < W - 2; x++, i++) {
      var lap = 2 * a0 * f[i] + a1 * (f[i - 1] + f[i + 1] + f[i - W] + f[i + W]) + a2 * (f[i - 2] + f[i + 2] + f[i - 2 * W] + f[i + 2 * W]);
      out[i] = -0.5 * lap + V[i] * f[i];
    }
  };
  CpuSim.prototype.setPotential = function (V, M) {
    for (var i = 0; i < V.length; i++) { this.V[i] = V[i]; if (M) this.M[i] = M[i]; }
  };
  // ψ0 = exp(−Δx²/(4σ²) − Δy²/(4σy²)) · exp(i k·r), normalised so Σ|ψ|² = 1
  CpuSim.prototype.initPacket = function (p) {
    var W = this.W, H = this.H, k = 2 * Math.PI / p.lambda, ang = p.angle || 0;
    var kx = k * Math.cos(ang), ky = k * Math.sin(ang), s2 = 4 * p.sigma * p.sigma, s2y = 4 * Math.pow(p.sigmaY || p.sigma, 2), sum = 0;
    for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
      var i = y * W + x, dx = x + 0.5 - p.x0, dy = y + 0.5 - p.y0;   // cell centre = index + 0.5
      var amp = this.M[i] > 0 && this.V[i] === 0 ? Math.exp(-dx * dx / s2 - dy * dy / s2y) : 0, ph = kx * x + ky * y;
      this.R[i] = amp * Math.cos(ph); this.I[i] = amp * Math.sin(ph); sum += amp * amp;
    }
    var c = 1 / Math.sqrt(sum), n = W * H, dt = this.dt;
    for (i = 0; i < n; i++) { this.R[i] *= c; this.I[i] *= c; }
    this.applyH(this.R, this.tmp);                 // stagger: I(±dt/2) ≈ I(0) ∓ (dt/2)·H R(0)
    for (i = 0; i < n; i++) { var h = 0.5 * dt * this.tmp[i]; this.Ip[i] = this.I[i] + h; this.I[i] -= h; }
    var q = 1 / Math.sqrt(this.norm());           // normalise the conserved Visscher density itself to exactly 1
    for (i = 0; i < n; i++) { this.R[i] *= q; this.I[i] *= q; this.Ip[i] *= q; }
    this.t = 0;
  };
  CpuSim.prototype.step = function (nSteps, flux) {
    var n = this.R.length, dt = this.dt, R = this.R, I = this.I, Ip = this.Ip, M = this.M, T = this.tmp;
    for (var s = 0; s < nSteps; s++) {
      this.applyH(I, T); for (var i = 0; i < n; i++) R[i] = (R[i] + dt * T[i]) * M[i];
      this.applyH(R, T); for (i = 0; i < n; i++) { Ip[i] = I[i]; I[i] = (I[i] - dt * T[i]) * M[i]; }
      this.t += dt;
      if (flux) this.accumFlux(flux);
    }
  };
  // detector = probability current through the screen line: j_x = R ∂xĪ − Ī ∂xR,  Ī = (I + Ip)/2
  CpuSim.prototype.accumFlux = function (fl) {
    var W = this.W, R = this.R, I = this.I, Ip = this.Ip, dt = this.dt;
    for (var y = 2; y < this.H - 2; y++) fl.acc[y] += dt * fluxAt(R, I, Ip, y * W + fl.x);
  };
  function fluxAt(R, I, Ip, i) {
    var b0 = 0.5 * (I[i] + Ip[i]);
    var dR = (R[i - 2] - 8 * R[i - 1] + 8 * R[i + 1] - R[i + 2]) / 12;
    var dI = (0.5 * (I[i - 2] + Ip[i - 2]) - 4 * (I[i - 1] + Ip[i - 1]) + 4 * (I[i + 1] + Ip[i + 1]) - 0.5 * (I[i + 2] + Ip[i + 2])) / 12;
    return R[i] * dI - b0 * dR;
  }
  // Visscher's density R(t)² + I(t+dt/2)·I(t−dt/2) is exactly conserved by the scheme
  CpuSim.prototype.norm = function () {
    var s = 0, R = this.R, I = this.I, Ip = this.Ip;
    for (var i = 0; i < R.length; i++) s += R[i] * R[i] + I[i] * Ip[i];
    return s;
  };
  CpuSim.prototype.moments = function () {
    var W = this.W, R = this.R, I = this.I, Ip = this.Ip, s = 0, sx = 0, sy = 0, sxx = 0, syy = 0;
    for (var i = 0; i < R.length; i++) {
      var p = R[i] * R[i] + I[i] * Ip[i], x = i % W, y = (i / W) | 0;
      s += p; sx += p * x; sy += p * y; sxx += p * x * x; syy += p * y * y;
    }
    var mx = sx / s, my = sy / s;
    return { n: s, x: mx, y: my, sx: Math.sqrt(sxx / s - mx * mx), sy: Math.sqrt(syy / s - my * my) };
  };

  /* ---------------- experiment geometry ---------------- */
  var DEFAULTS = {
    single: { lambda: 8, d: 40, a: 24, n: 4, sigma: 20 },
    double: { lambda: 8, d: 40, a: 8, n: 4, sigma: 20 },
    multi: { lambda: 8, d: 20, a: 5, n: 4, sigma: 24 }
  };
  var SPAN_MAX = GRID_H - 2 * BAND - 24;           // slits must stay clear of the absorbing band
  function slitCount(s) { return s.setup === 'single' ? 1 : s.setup === 'double' ? 2 : s.n; }
  // UI state → full scene parameters (packet placed 3σ clear of the absorber, wall 3.5σ ahead of it)
  function sceneParams(s, W, H) {
    W = W || GRID_W; H = H || GRID_H;
    var N = slitCount(s), sigma = s.sigma, x0 = Math.round(BAND + 6 + 3 * sigma);
    var d = s.d, a = Math.min(s.a, N > 1 ? d - 4 : s.a);
    if (N > 1 && (N - 1) * d + a > SPAN_MAX) d = Math.floor((SPAN_MAX - a) / (N - 1));
    return { N: N, d: d, a: a, lambda: s.lambda, sigma: sigma, x0: x0, y0: H / 2,
      wallX: Math.round(x0 + 3.5 * sigma), wallT: 4, screenX: W - BAND - 10 };
  }
  function screenDistance(p) { return p.screenX + 0.5 - (p.wallX + p.wallT / 2); }
  function slitList(p, H) {
    var yc = H / 2, out = [];
    for (var j = 0; j < p.N; j++) { var c = yc + (j - (p.N - 1) / 2) * p.d; out.push({ c: c, y0: c - p.a / 2, y1: c + p.a / 2 }); }
    return out;
  }
  // wall of height V_CAP (E ≈ 0.3, so it is effectively hard: tunnelling through 4 cells ~1e-8).
  // opts.only = j → only slit j is open (which-path branch)
  function buildScene(p, W, H, opts) {
    opts = opts || {};
    var V = new Float32Array(W * H), wall = new Uint8Array(W * H), slits = slitList(p, H), only = opts.only == null ? -1 : opts.only;
    for (var y = 0; y < H; y++) {
      var yy = y + 0.5, open = false;          // cell-centre test → every slit is exactly a cells wide
      for (var j = 0; j < slits.length; j++) if ((only < 0 || only === j) && yy > slits[j].y0 && yy < slits[j].y1) open = true;
      if (open) continue;
      for (var x = p.wallX; x < p.wallX + p.wallT; x++) { V[y * W + x] = V_CAP; wall[y * W + x] = 1; }
    }
    return { V: V, wall: wall, slits: slits };
  }

  /* ---------------- theory ---------------- */
  function sinc(x) { return Math.abs(x) < 1e-9 ? 1 : Math.sin(x) / x; }
  // Fraunhofer: |F(sinθ)|² = sinc²β · [sin Nα / (N sin α)]²,  α = π d sinθ/λ,  β = π a sinθ/λ.
  // Plotted as flux per unit screen length: × cos²θ (Rayleigh–Sommerfeld obliquity) × cos²θ (flat screen).
  // incoherent = which-path known → no interference factor.
  function fraunhofer(y, p, H, incoherent) {
    var L = screenDistance(p), th = Math.atan((y - H / 2) / L), s = Math.sin(th);
    var b = Math.PI * p.a * s / p.lambda, al = Math.PI * p.d * s / p.lambda, g = 1;
    if (p.N > 1 && !incoherent) { var den = p.N * Math.sin(al); g = Math.abs(den) < 1e-9 ? 1 : Math.sin(p.N * al) / den; }
    var c = Math.cos(th);
    return sinc(b) * sinc(b) * g * g * c * c * c * c;
  }
  // Near-field Huygens–Fresnel (2-D Rayleigh–Sommerfeld): the aperture field is the incident Gaussian beam at
  // the wall; U(P) = Σ A(y′) cosθ′ e^{ikr}/√r, flux ∝ |U|² cosθ, averaged over the packet's spread Δk = 1/(2σ).
  // incoherent → Σ_j |U_j|² (each slit separately).
  function huygens(ys, p, H, incoherent) {
    var slits = slitList(p, H), xa = p.wallX + p.wallT / 2, L = screenDistance(p), k0 = 2 * Math.PI / p.lambda;
    var tW = (xa - p.x0) / k0, sw = p.sigma * Math.sqrt(1 + Math.pow(tW / (2 * p.sigma * p.sigma), 2));
    var groups = [], dy = 0.25;
    for (var j = 0; j < slits.length; j++) {
      var g = [];
      for (var yq = slits[j].y0 + dy / 2; yq < slits[j].y1; yq += dy) g.push([yq, Math.exp(-(yq - p.y0) * (yq - p.y0) / (4 * sw * sw))]);
      groups.push(g);
    }
    var nk = 9, dk = 1 / (2 * p.sigma), out = new Float64Array(ys.length), wsum = 0;
    for (var q = 0; q < nk; q++) {
      var z = -2 + 4 * q / (nk - 1), k = k0 + z * dk, w = Math.exp(-z * z / 2) * k;   // arrivals ∝ velocity
      wsum += w;
      for (var i = 0; i < ys.length; i++) {
        var tr = 0, ti = 0, inc = 0;
        for (j = 0; j < groups.length; j++) {
          var re = 0, im = 0, pts = groups[j];
          for (var m = 0; m < pts.length; m++) {
            var ddy = ys[i] - pts[m][0], r = Math.sqrt(L * L + ddy * ddy), amp = pts[m][1] * (L / r) / Math.sqrt(r);
            re += amp * Math.cos(k * r); im += amp * Math.sin(k * r);
          }
          tr += re; ti += im; inc += re * re + im * im;
        }
        var ct = L / Math.sqrt(L * L + Math.pow(ys[i] - H / 2, 2));
        out[i] += w * (incoherent ? inc : tr * tr + ti * ti) * ct;
      }
    }
    for (i = 0; i < ys.length; i++) out[i] /= wsum;
    return out;
  }
  // both theory curves sampled at cell centres, normalised to their maximum
  function theoryCurves(p, H, incoherent) {
    var ys = new Float64Array(H), fr = new Float64Array(H);
    for (var y = 0; y < H; y++) { ys[y] = y + 0.5; fr[y] = fraunhofer(y + 0.5, p, H, incoherent); }
    return { fr: normalizeMax(fr), hu: normalizeMax(huygens(ys, p, H, incoherent)) };
  }
  // exact far-field geometry: m-th maximum at sinθ = mλ/d → y = L tan θ
  function fringeTheory(p) {
    var L = screenDistance(p), r = p.lambda / p.d;
    return { smallAngle: p.lambda * L / p.d, exact: r < 1 ? L * Math.tan(Math.asin(r)) : NaN };
  }
  function firstMinTheory(p) { var L = screenDistance(p), r = p.lambda / p.a; return r < 1 ? L * Math.tan(Math.asin(r)) : NaN; }

  /* ---------------- curve analysis ---------------- */
  function normalizeMax(a) { var m = 0, i, o = new Float64Array(a.length); for (i = 0; i < a.length; i++) m = Math.max(m, a[i]); for (i = 0; i < a.length; i++) o[i] = m > 0 ? Math.max(0, a[i]) / m : 0; return o; }
  function normalizeSum(a) { var s = 0, i, o = new Float64Array(a.length); for (i = 0; i < a.length; i++) s += Math.max(0, a[i]); for (i = 0; i < a.length; i++) o[i] = s > 0 ? Math.max(0, a[i]) / s : 0; return o; }
  // local extrema with parabolic sub-cell refinement; kind 1 = maxima (must exceed floor × max), −1 = minima
  function extrema(a, lo, hi, kind, floor) {
    var g = 0, i, out = [];
    for (i = lo; i < hi; i++) g = Math.max(g, a[i]);
    for (i = Math.max(lo, 1); i < Math.min(hi, a.length - 1); i++) {
      var v = kind * a[i];

// CPU fallback (no WebGL2 float render targets): same physics, drawn with ImageData
function CpuEngine(canvas, W, H) {

/* ---------------- particle mode ---------------- */

/* ---------------- drawing ---------------- */

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  var wr = $('#wave').getBoundingClientRect(), dr = $('#det').getBoundingClientRect();
  cv.ww = Math.max(1, Math.round(wr.width * dpr)); cv.wh = Math.max(1, Math.round(wr.height * dpr));
  cv.dw = Math.max(1, Math.round(dr.width * dpr)); cv.dh = cv.wh;
  if (gl) { $('#glCanvas').width = cv.ww; $('#glCanvas').height = cv.wh; }
  $('#ovCanvas').width = cv.ww; $('#ovCanvas').height = cv.wh;

  dotLayer.width = Math.max(1, Math.round(cv.dw * 0.44)); dotLayer.height = cv.dh;

}

}

  eL1t: '전자도 파동이다', eL1: '<p>드브로이(1924)는 운동량 p인 입자에 파장 λ = h/p가 있다고 했습니다. 전압 V로 가속한 전자는 λ = h/√(2meV) — 54 V면 1.67 Å, 결정 속 원자 간격과 비슷합니다.</p><p>그래서 결정은 전자에게 회절격자가 됩니다. 표면의 원자 줄 간격 D에서 반사된 파동들의 경로차가 파장의 정수배가 되는 각도에서만 보강됩니다.</p><div class="eq">D sin φ = n λ</div>',
  eL2t: '데이비슨–거머 실험 (1927)', eL2: '<p>니켈 결정에 전자를 쏘고 각도별로 튕겨 나온 전자 수를 셌더니, 54 eV에서 50° 방향에 뚜렷한 봉우리가 나타났습니다. 니켈 표면의 원자 간격 2.15 Å을 넣으면 D sinφ = λ가 예측하는 각도가 50.9°입니다.</p><p>이 실험실은 2차원 모형이지만, 슈뢰딩거 방정식으로 전자 파동을 직접 흩어 같은 봉우리가 나오는지, 그리고 에너지 스캔으로 54 eV 근처에서 가장 강해지는지 확인합니다.</p>',
  xL1t: 'X선과 브래그 법칙', xL1: '<p>X선 파장(약 1 Å)은 결정 속 원자 면 사이 간격 d와 비슷합니다. 평행한 원자 면에서 반사된 X선의 경로차 2d sinθ가 파장의 정수배일 때만 보강됩니다.</p><div class="eq">2 d sin θ = n λ</div><p>분말 시료에는 결정 알갱이가 모든 방향으로 놓여 있어서, 각 반사가 원뿔이 되고 검출기에는 고리로 찍힙니다.</p>',
  xL2t: '세기는 원자 배치를 말해 준다', xL2: '<p>같은 면심입방 격자라도 단위세포 안에 어떤 원자가 어디 있느냐에 따라 반사마다 파동이 보강되거나 상쇄됩니다. 이것이 구조 인자 F<sub>hkl</sub>입니다.</p><p>KCl은 K⁺와 Cl⁻의 전자 수(18)가 같아 X선에게는 거의 같은 원자처럼 보이고, 그래서 (111) 같은 홀수 반사가 사라집니다. NaCl에서는 약하게 남습니다. 시뮬은 이 공식을 쓰지 않고 모든 원자 쌍을 더해서 같은 결과가 나오는지 확인합니다.</p>',
  dL1t: '나선은 X자를 만든다', dL1: '<p>나선을 옆에서 보면 지그재그 두 방향의 줄이 겹친 모양입니다. 그래서 회절 무늬는 X자가 되고, 피치 P마다 반복되므로 Z = l/P 간격의 가로줄(층선) 위에만 빛이 모입니다.</p><p>층선 l 위의 세기는 베셀 함수 J<sub>l</sub>(2πRr)를 따르고, 번호가 클수록 봉우리가 바깥으로 밀려 X자의 팔이 됩니다.</p>',
  dL2t: '사진 51이 알려 준 것', dL2: '<p>프랭클린의 사진 51에서 층선 간격으로 피치 34 Å, 위아래 끝의 강한 자오선 반사로 염기쌍 간격 3.4 Å(한 바퀴 10쌍)을 읽을 수 있습니다.</p><p>그리고 4번째 층선이 빠져 있습니다. 두 가닥이 피치의 3/8만큼 어긋나 있으면 l = 4에서 두 가닥의 파동이 상쇄되기 때문입니다. 이것이 큰 홈과 작은 홈이 있는 이중 나선의 증거였습니다. ‘홈 크기 같음’과 ‘한 가닥’ 모형과 비교해 보세요.</p>',
  cL1t: '빛은 운동량을 가진 입자다', cL1: '<p>고전 파동 이론에서는 흩어진 빛의 파장이 바뀌지 않아야 합니다. 그런데 콤프턴(1923)은 흑연에 X선을 쏘고 산란된 X선의 파장이 각도에 따라 늘어나는 것을 발견했습니다.</p><p>광자를 에너지 E = hc/λ, 운동량 p = h/λ인 입자로 보고 전자와의 충돌에 에너지·운동량 보존을 적용하면 정확히 이 식이 나옵니다.</p><div class="eq">Δλ = (h / m<sub>e</sub>c)(1 − cos θ)</div>',
  cL2t: '안 바뀐 선과 바뀐 선', cL2: '<p>스펙트럼에는 봉우리가 두 개 있습니다. 원자에 단단히 묶인 전자에서는 원자 전체가 반동해 파장이 거의 그대로인 선이, 느슨한 전자와는 바뀐 선이 생깁니다. 각도가 클수록 바뀐 선이 강해집니다.</p><p>바뀐 선이 넓은 이유는 전자가 원자 안에서 움직이고 있기 때문입니다(도플러 넓어짐). 여러 각도에서 측정해 Δλ를 1 − cos θ에 대해 그리면 기울기가 바로 콤프턴 파장 h/mc입니다.</p>'
});

      xray: { done: function () { return XR.status === 'done'; }, dots: function () { return XR.k.dots.length; }, layer: dot2 },
      dna: { done: function () { return DN.status === 'done'; }, dots: function () { return DN.k.dots.length; }, layer: dot2 },
      compton: { done: function () { return CP.status === 'done'; }, dots: function () { return CP.cnt; }, layer: null }
    };
    for (var i = 0; i < X.order.length; i++) {
      var id = X.order[i], sp = specs[id]; switchExp(id); await sleep(150);
      if (id === 'compton') { CP.N = 2000; C().fire(); } else C().part();
      var ok1 = await until(function () { return sp.done() && sp.dots() > 50; }, 25000);
      var inkBefore = sp.layer ? ink(sp.layer) : 1;
      C().fire(); await sleep(120);                                         // fire again while particles are running (the old crash)
      C().reset(); await sleep(150);
      var inkAfter = sp.layer ? ink(sp.layer) : 0, cleared = sp.dots() === 0 && inkAfter === 0;
      log.push(id + (ok1 && inkBefore > 0 && cleared ? ' ✓' : ' ✗(' + ok1 + ',' + inkBefore + '→' + inkAfter + ',' + sp.dots() + ')'));
    }
    X.rate = savedRate; CP.N = 5000; switchExp('slit'); window.removeEventListener('error', onErr);
    var ok = log.every(function (s) { return s.slice(-1) === '✓'; }) && errs === 0;
    return { ok: ok, info: log.join(' · ') + ' · errors ' + errs };
  });

  var pass = results.filter(function (r) { return r.ok; }).length;
  $('#testTitle').textContent = t('tTitle') + ': ' + pass + ' / ' + results.length;
  document.title = 'Tests ' + pass + '/' + results.length;
  console.log('TESTS ' + pass + '/' + results.length);
}
boot();
</script>
